# Runs the app's tests against the mhspcarpi commit pinned in PACKAGE_REF.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned package commit
        id: package
        run: echo "ref=$(head -n 1 PACKAGE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: wfukuokaya/mhspcarpi
          ref: ${{ steps.package.outputs.ref }}
          path: mhspcarpi
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: mhspcarpi
          extra-packages: local::., any::shiny, any::bslib, any::htmltools, any::svglite, any::testthat
      - name: Run the tests
        run: Rscript tests/testthat.R
