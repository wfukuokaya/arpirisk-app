# Builds the static calculator with Shinylive and deploys it to Cloudflare
# Pages. Requires the repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. It runs when a release is published or when started by
# hand, so that an ordinary push never changes the live calculator.
on:
  release:
    types: [published]
  workflow_dispatch:

name: deploy

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_PROJECT: arpi-treatment-effect-estimator
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned package commit
        id: package
        run: echo "ref=$(head -n 1 PACKAGE_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: wfukuokaya/arpirisk
          ref: ${{ steps.package.outputs.ref }}
          path: arpirisk
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: arpirisk
          extra-packages: any::shinylive, any::shiny, any::bslib, any::htmltools, any::svglite
      - name: Build the Shinylive site
        run: Rscript tools/build_shinylive.R _site arpirisk
      # Releases check out a detached commit; --branch=main publishes to
      # production instead of a preview.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ env.CLOUDFLARE_PROJECT }} --branch=main
